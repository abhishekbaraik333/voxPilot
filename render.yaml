services:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Server (Fastify API, Twilio Webhooks, WebSockets)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: voxpilot-server
    runtime: node
    plan: starter # Starter plan or higher is recommended for uninterrupted WebSockets & Twilio streams
    buildCommand: pnpm install && pnpm build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@voxpilot.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WEBHOOK_BASE_URL
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_MODEL_ID
        value: eleven_turbo_v2_5
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEFAULT_LLM_MODEL
        value: inclusionai/ling-2.6-flash
      - key: DASHBOARD_URL
        sync: false

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Dashboard (Next.js 15 App)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: voxpilot-web
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter @voxpilot/web build
    startCommand: pnpm --filter @voxpilot/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false
